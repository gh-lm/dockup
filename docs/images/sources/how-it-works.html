<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>How Dockup works</title>
<style>
  @font-face {
    font-family: "Trindle Sans";
    src: url("../../../app/static/fonts/TrindleSans-Variable.woff2") format("woff2-variations");
    font-weight: 100 900;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 360px; }
  body {
    font-family: "Trindle Sans", system-ui, sans-serif;
    background: #1c1e26; color: #fafafa;
    display: grid; grid-template-columns: 1fr 64px 1fr 64px 1fr; align-items: center;
    padding: 0 56px;
  }
  .step {
    background: #282b34; border: 1px solid rgba(255,255,255,.09); border-radius: 22px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 0 0 1px rgba(0,0,0,.45),
      0 4px 8px rgba(0,0,0,.35), 0 16px 32px -12px rgba(0,0,0,.55);
    padding: 26px 28px; height: 264px; display: grid; align-content: start; gap: 12px;
  }
  .num {
    width: 40px; height: 40px; border-radius: 50%; background: #fbc711; color: #645007;
    display: grid; place-items: center; font-weight: 700; font-size: 22px;
  }
  h2 { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  p { font-size: 21px; color: #c2c2cc; line-height: 1.4; }
  code {
    font-family: ui-monospace, "Cascadia Mono", Menlo, monospace; font-size: 18px;
    background: #14151b; border: 1px solid #454955; border-radius: 8px; padding: 2px 8px;
    color: #fafafa;
  }
  .arrow { display: grid; place-items: center; }
  .arrow svg { width: 40px; height: 40px; color: #7e8494; }
</style>
</head>
<body>
  <section class="step">
    <div class="num">1</div>
    <h2>A folder of stacks</h2>
    <p>Each stack is a plain folder with a <code>compose.yaml</code>. Nothing is locked away.</p>
  </section>
  <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <section class="step">
    <div class="num">2</div>
    <h2>One container</h2>
    <p>Dockup runs beside them and talks to Docker, including as one of its own stacks.</p>
  </section>
  <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  <section class="step">
    <div class="num">3</div>
    <h2>Any browser</h2>
    <p>Sign in, and every stack, its logs and its terminal are in one window.</p>
  </section>
</body>
</html>
