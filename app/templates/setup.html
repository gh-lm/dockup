<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Welcome - Dockup</title>
<link rel="icon" href="/static/icons/dockup.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body class="auth-page">
<main class="auth-wrap auth-single">
  <div class="panel auth-panel">
    <div class="auth-logo">
      <svg width="44" height="44" viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="26" width="16" height="16" rx="3" fill="var(--accent)"/><rect x="26" y="26" width="16" height="16" rx="3" fill="var(--brand-navy)" class="logo-navy"/><rect x="16" y="6" width="16" height="16" rx="3" fill="var(--brand-navy)" class="logo-navy"/></svg>
      <h1>Welcome to Dockup</h1>
    </div>
    <p class="hint">First run: create the admin account this machine will use to sign in. You can switch on two-factor later in Settings.</p>
    {% if error %}<p class="alert alert-danger" role="alert">! {{ error }}</p>{% endif %}
    <form method="post" class="form-grid">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required autofocus minlength="3">
      </div>
      <div class="field">
        <label for="password">Password <span class="hint">(at least 12 characters)</span></label>
        <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12">
      </div>
      <div class="field">
        <label for="confirm">Repeat the password</label>
        <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="12">
      </div>
      <button class="btn btn-primary" type="submit">Create account</button>
    </form>
  </div>
</main>
</body>
</html>
